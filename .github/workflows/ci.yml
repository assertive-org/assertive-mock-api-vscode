name: CI

on:
  - push

jobs:
  tests:
    name: Run CI
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          make install-dev-deps

      - name: Run CI
        run: |
          xvfb-run -a make ci
